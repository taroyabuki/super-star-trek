// Show one widget, hide all others (use inline style for guaranteed hiding)
function showWidget(id) {
  document.querySelectorAll('.widget').forEach(w => {
    w.classList.remove('active');
    w.style.display = 'none';
  });
  if (id === 'widget-nav') {
    showNavOverlay();
    return;
  }
  navHide();
  const w = document.getElementById(id);
  if (w) {
    w.classList.add('active');
    w.style.display = 'flex';
  }
}

// Determine which widget to show for a given prompt
function widgetForPrompt(prompt) {
  const p = prompt.trim().toUpperCase();
  if (p.startsWith('COURSE') || p.includes('TORPEDO COURSE')) return 'widget-nav';
  if (p.startsWith('WARP FACTOR'))                               return 'widget-warp';
  if (p.startsWith('NUMBER OF UNITS TO FIRE'))                   return 'widget-energy';
  if (p.startsWith('NUMBER OF UNITS TO SHIELDS'))                return 'widget-energy';
  if (p.startsWith('COMPUTER OPTION') || p.startsWith('COMPUTER ACTIVE')) return 'widget-computer';
  if (p.includes('COORDINATES'))                                 return 'sector-click';
  if (p.includes('AUTHORIZE') || p.includes('(Y/N)'))           return 'widget-yesno';
  return 'widget-text';
}

function promptUser(prompt) {
  lastPrompt = prompt;
  const p = prompt.trim().toUpperCase();
  const isCommand = (p === 'COMMAND');

  // Auto-run SRS transparently on COMMAND prompt after PHA/TOR
  if (isCommand && autoRunSRS) {
    autoRunSRS = false;
    isWaitingForInput = true;
    return new Promise(resolve => {
      inputResolve = resolve;
      requestAnimationFrame(() => {
        const r = inputResolve;
        isWaitingForInput = false;
        inputResolve = null;
        r('SRS');
      });
    });
  }

  // Auto-run LRS transparently on COMMAND prompt when flagged
  if (isCommand && autoRunLRS) {
    autoRunLRS = false;
    isWaitingForInput = true;
    return new Promise(resolve => {
      inputResolve = resolve;
      requestAnimationFrame(() => {
        const r = inputResolve;
        isWaitingForInput = false;
        inputResolve = null;
        r('LRS');
      });
    });
  }

  const cmdButtons = document.getElementById('command-buttons');
  const widgetArea = document.getElementById('widget-area');

  // Toggle command buttons vs sub-command widget area
  if (isCommand) {
    cmdButtons.style.display = 'grid';
    widgetArea.style.display = 'none';
    document.querySelectorAll('.widget').forEach(w => { w.classList.remove('active'); w.style.display = 'none'; });
    navHide();
    sectorClickDeactivate();
    document.querySelectorAll('.sc-from, .sc-to').forEach(c => c.classList.remove('sc-from', 'sc-to'));
    document.querySelectorAll('.cmd-btn').forEach(btn => { btn.disabled = false; });
  } else {
    cmdButtons.style.display = 'none';
    document.querySelectorAll('.cmd-btn').forEach(btn => { btn.disabled = true; });

    // Sliders: update max values based on current state
    const gs = getGameState();
    if (p.startsWith('NUMBER OF UNITS TO FIRE')) {
      const maxE = Math.max(0, Math.floor((gs.energyRemaining || 0)));
      document.getElementById('energy-slider').max = maxE;
      document.getElementById('energy-slider').value = Math.min(500, maxE);
      document.getElementById('energy-unit').textContent = '発射量';
      document.getElementById('energy-val').textContent = document.getElementById('energy-slider').value;
    } else if (p.startsWith('NUMBER OF UNITS TO SHIELDS')) {
      const maxE = Math.max(0, Math.floor((gs.energyRemaining || 0) + (gs.shieldsCurrent || 0)));
      document.getElementById('energy-slider').max = maxE;
      document.getElementById('energy-slider').value = Math.floor(gs.shieldsCurrent || 0);
      document.getElementById('energy-unit').textContent = 'シールド';
      document.getElementById('energy-val').textContent = document.getElementById('energy-slider').value;
    } else if (p.startsWith('WARP FACTOR')) {
      const maxWarp = (gs.systemsDamage && gs.systemsDamage['WARP ENGINES'] < 0) ? 0.2 : 8;
      document.getElementById('warp-slider').max = maxWarp;
      document.getElementById('warp-slider').value = Math.min(1, maxWarp);
      document.getElementById('warp-val').textContent = parseFloat(document.getElementById('warp-slider').value).toFixed(1);
    }

    // Show the right widget
    const wid = widgetForPrompt(prompt);
    if (wid === 'widget-yesno') {
      const desc = document.getElementById('yesno-description');
      if (desc) desc.textContent = translatePrompt(prompt);
    }
    // nav circle is full-screen canvas — no widget-area needed
    // sector-click: activate cell-click mode on sector map
    if (wid === 'sector-click') {
      const isFrom = prompt.toUpperCase().includes('INITIAL');
      sectorClickActivate(isFrom);
      widgetArea.style.display = 'none';
    } else {
      widgetArea.style.display = (wid === 'widget-nav') ? 'none' : 'flex';
      showWidget(wid);
    }
  }

  isWaitingForInput = true;
  return new Promise(resolve => { inputResolve = resolve; });
}

// ---- Sector click-select mode (for Direction/Distance Calculator) ----
let _sectorClickActive = false;
let _sectorClickIsFrom = true;

function sectorClickActivate(isFrom) {
  _sectorClickActive = true;
  _sectorClickIsFrom = isFrom;
  const L = LANG_UI[currentLang] || LANG_UI.ja;
  const msg = isFrom ? L.clickFrom : L.clickTo;
  const banner = document.getElementById('sector-click-banner');
  if (banner) { banner.textContent = '▶ ' + msg; banner.style.display = 'block'; }
  addToLog(msg);
  const grid = document.getElementById('sector-grid');
  if (grid) grid.classList.add('select-mode');
  document.getElementById('sector-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function sectorClickDeactivate() {
  _sectorClickActive = false;
  const banner = document.getElementById('sector-click-banner');
  if (banner) banner.style.display = 'none';
  const grid = document.getElementById('sector-grid');
  if (grid) grid.classList.remove('select-mode');
}

// Sector grid click handler for select mode
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('sector-grid');
  if (!grid) return;
  grid.addEventListener('click', (e) => {
    if (!_sectorClickActive) return;
    const cell = e.target.closest('.sector-cell');
    if (!cell) return;
    const parts = cell.id.split('-'); // sc-Y-X
    const y = parts[1], x = parts[2];
    // Highlight the selected cell
    document.querySelectorAll('.sc-from, .sc-to').forEach(c => {
      if (_sectorClickIsFrom) c.classList.remove('sc-from');
      else c.classList.remove('sc-to');
    });
    cell.classList.add(_sectorClickIsFrom ? 'sc-from' : 'sc-to');
    sectorClickDeactivate();
    submitInput(`${y},${x}`);
  });
});

// ---- Navigation overlay (sector map circle) ----
const NAV_CELL = 32; // 30px cell + 2px gap
let _navCanvas = null;
let _navCtx = null;

function navGetShipCenter() {
  const gs = getGameState();
  const sY = Math.floor(gs.sectorPositionY);
  const sX = Math.floor(gs.sectorPositionX);
  const cell = document.getElementById(`sc-${sY}-${sX}`);
  if (cell) {
    const cr = cell.getBoundingClientRect();
    return { cx: cr.left + cr.width / 2, cy: cr.top + cr.height / 2 };
  }
  return { cx: window.innerWidth / 2, cy: window.innerHeight / 2 };
}

// Convert screen delta (dx, dy) → float course [1, 9)
// COURSE_TO_XY: course1=East, going CCW: E→NE→N→NW→W→SW→S→SE
function navAngleToCourse(dx, dy) {
  const angle = Math.atan2(dy, dx); // 0=right, CW positive in screen
  const raw = -angle / (Math.PI / 4); // each course step = 45° CCW
  const mod8 = ((raw % 8) + 8) % 8;
  return 1 + mod8; // [1, 9)
}

function navDraw(mousePos) {
  const canvas = _navCanvas;
  const ctx = _navCtx;
  if (!canvas || !ctx) return;
  const { cx, cy } = navGetShipCenter();
  const sectorGrid = document.getElementById('sector-grid');
  const sgRect = sectorGrid ? sectorGrid.getBoundingClientRect() : null;
  const R = sgRect ? sgRect.width / 2 : Math.min(canvas.width, canvas.height) * 0.42;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Dim overlay
  ctx.fillStyle = 'rgba(0,0,18,0.72)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Dashed orbit circle
  ctx.save();
  ctx.strokeStyle = 'rgba(0,200,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 8 course markers
  for (let c = 1; c <= 8; c++) {
    const a = -(c - 1) * Math.PI / 4; // CCW from East
    const mx = cx + Math.cos(a) * R;
    const my = cy + Math.sin(a) * R;
    ctx.fillStyle = 'rgba(0,200,255,0.9)';
    ctx.beginPath();
    ctx.arc(mx, my, 4, 0, Math.PI * 2);
    ctx.fill();
    // Course number label outside circle
    const lx = cx + Math.cos(a) * (R + 15);
    const ly = cy + Math.sin(a) * (R + 15);
    ctx.fillStyle = '#00efff';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(c), lx, ly);
  }

  // Arrow + course readout when mouse is present
  if (mousePos) {
    const dx = mousePos.x - cx;
    const dy = mousePos.y - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > 6) {
      const course = navAngleToCourse(dx, dy);
      const ndx = dx / dist;
      const ndy = dy / dist;
      const arrowLen = Math.min(dist, R - 4);

      // Arrow shaft
      ctx.save();
      ctx.strokeStyle = 'rgba(255,215,0,0.95)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + ndx * arrowLen, cy + ndy * arrowLen);
      ctx.stroke();
      ctx.restore();

      // Arrowhead
      const ha = Math.atan2(ndy, ndx);
      const hl = 9;
      ctx.fillStyle = 'rgba(255,215,0,0.95)';
      ctx.beginPath();
      ctx.moveTo(cx + ndx * arrowLen, cy + ndy * arrowLen);
      ctx.lineTo(cx + ndx * arrowLen - hl * Math.cos(ha - 0.38), cy + ndy * arrowLen - hl * Math.sin(ha - 0.38));
      ctx.lineTo(cx + ndx * arrowLen - hl * Math.cos(ha + 0.38), cy + ndy * arrowLen - hl * Math.sin(ha + 0.38));
      ctx.closePath();
      ctx.fill();

      // Course value badge
      const badgeW = 88, badgeH = 20;
      const bx = cx - badgeW / 2;
      const by = cy - R - badgeH - 6;
      ctx.fillStyle = 'rgba(0,0,18,0.85)';
      ctx.strokeStyle = 'rgba(255,215,0,0.7)';
      ctx.lineWidth = 1;
      ctx.fillRect(bx, by, badgeW, badgeH);
      ctx.strokeRect(bx, by, badgeW, badgeH);
      ctx.fillStyle = 'rgba(255,215,0,1)';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`コース ${course.toFixed(1)}`, cx, by + badgeH / 2);
    }
  }

  // Ship dot
  ctx.fillStyle = 'rgba(255,215,0,0.95)';
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fill();
}

function _navMouseMove(e) {
  navDraw({ x: e.clientX, y: e.clientY });
}
function _navClick(e) {
  const { cx, cy } = navGetShipCenter();
  const sectorGrid = document.getElementById('sector-grid');
  const sgRect = sectorGrid ? sectorGrid.getBoundingClientRect() : null;
  const R = sgRect ? sgRect.width / 2 : Math.min(window.innerWidth, window.innerHeight) * 0.42;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  if (dist < 6) return; // too close to center
  if (dist > R) { navHide(); submitInput(''); return; } // outside circle = cancel
  const course = navAngleToCourse(e.clientX - cx, e.clientY - cy);
  navHide();
  submitInput(course.toFixed(1));
}

function _navKeydown(e) {
  if (e.key === 'Escape') { navHide(); submitInput(''); }
}

function showNavOverlay() {
  const canvas = document.getElementById('nav-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  _navCanvas = canvas;
  _navCtx = canvas.getContext('2d');
  navDraw(null);
  canvas.addEventListener('mousemove', _navMouseMove);
  canvas.addEventListener('click',     _navClick);
  document.addEventListener('keydown', _navKeydown);
  // Position cancel button above the course badge area
  const { cx, cy } = navGetShipCenter();
  const sectorGrid = document.getElementById('sector-grid');
  const sgRect = sectorGrid ? sectorGrid.getBoundingClientRect() : null;
  const R = sgRect ? sgRect.width / 2 : Math.min(window.innerWidth, window.innerHeight) * 0.42;
  const btn = document.getElementById('nav-cancel-btn');
  if (btn) {
    btn.style.left = cx + 'px';           // transform: translateX(-50%) centers it
    btn.style.top  = (cy + R + 10) + 'px'; // below circle
    btn.style.display = 'block';
  }
}

function navHide() {
  const canvas = document.getElementById('nav-canvas');
  if (!canvas) return;
  canvas.style.display = 'none';
  canvas.removeEventListener('mousemove', _navMouseMove);
  canvas.removeEventListener('click',     _navClick);
  document.removeEventListener('keydown', _navKeydown);
  _navCanvas = null;
  _navCtx = null;
  const btn = document.getElementById('nav-cancel-btn');
  if (btn) btn.style.display = 'none';
}

function submitInput(value) {
  if (!isWaitingForInput || !inputResolve) {
    // Game not waiting — may have crashed; restart game
    if (!isWaitingForInput) {
      addToLog('ゲームを再起動します...');
      setTimeout(() => window.location.reload(), 800);
    }
    return;
  }
  navHide();
  const val = String(value || '').trim();

  // Track pendingSRS / pendingLRS / autoRunLRS flags
  const lp = lastPrompt.trim().toUpperCase();
  if (lp.includes('AUTHORIZE') && val.toUpperCase() === 'Y') {
    pendingSRS = true;   // DAM repair authorized → SRS needed
    pendingLRS = true;   // and LRS needed
  } else if (lp === 'COMMAND') {
    if (val.toUpperCase() === 'NAV') { pendingSRS = false; pendingLRS = false; autoRunLRS = true; }
    if (val.toUpperCase() === 'SRS') { pendingSRS = false; autoRunSRS = false; }
    if (val.toUpperCase() === 'LRS') { pendingLRS = false; autoRunLRS = false; }
    if (val.toUpperCase() === 'PHA' || val.toUpperCase() === 'TOR') autoRunSRS = true;
  }
  updateSrsButton();
  updateLrsButton();

  // Echo to log
  const line = document.createElement('div');
  line.className = 'log-line prompt';
  line.textContent = `> ${translatePrompt(lastPrompt)}？ ${val}`;
  messageLog.appendChild(line);
  requestAnimationFrame(() => { messageLog.scrollTop = messageLog.scrollHeight; });
  // Reset
  isWaitingForInput = false;
  const resolve = inputResolve;
  inputResolve = null;
  resolve(val);
}

// ---- Wire up all widgets ----


// Command buttons
document.querySelectorAll('.cmd-btn').forEach(btn => {
  btn.addEventListener('click', () => { if (!btn.disabled) submitInput(btn.dataset.cmd); });
});

// Warp slider
const warpSlider = document.getElementById('warp-slider');
const warpVal    = document.getElementById('warp-val');
warpSlider.addEventListener('input', () => { warpVal.textContent = parseFloat(warpSlider.value).toFixed(1); });
document.getElementById('warp-ok').addEventListener('click', () => submitInput(warpSlider.value));

// Energy slider
const energySlider = document.getElementById('energy-slider');
const energyVal    = document.getElementById('energy-val');
energySlider.addEventListener('input', () => { energyVal.textContent = energySlider.value; });
document.getElementById('energy-ok').addEventListener('click', () => submitInput(energySlider.value));
document.getElementById('energy-all').addEventListener('click', () => {
  energySlider.value = energySlider.max;
  energyVal.textContent = energySlider.max;
});
document.getElementById('energy-half').addEventListener('click', () => {
  const h = Math.floor(energySlider.max / 2);
  energySlider.value = h; energyVal.textContent = h;
});
document.getElementById('energy-zero').addEventListener('click', () => {
  energySlider.value = 0; energyVal.textContent = 0;
});

// Computer options
document.querySelectorAll('.comp-opt-btn').forEach(btn => {
  btn.addEventListener('click', () => submitInput(btn.dataset.val));
});

// Coordinates
document.getElementById('coords-ok').addEventListener('click', () => {
  const y = document.getElementById('coord-y').value;
  const x = document.getElementById('coord-x').value;
  submitInput(`${y},${x}`);
});

document.getElementById('yesno-yes').addEventListener('click', () => submitInput('Y'));
document.getElementById('yesno-no').addEventListener('click',  () => submitInput('N'));

// Cancel helper: submit value that causes current command to abort
function cancelValue(prompt) {
  const p = prompt.trim().toUpperCase();
  if (p.startsWith('NUMBER OF UNITS TO SHIELDS')) return '-1';
  if (p.startsWith('NUMBER OF UNITS'))            return '0';
  if (p.startsWith('COMPUTER'))                   return '-1';
  return ''; // NaN for course/warp/coords → abort on invalid
}
document.getElementById('warp-cancel').addEventListener('click',     () => submitInput(cancelValue(lastPrompt)));
document.getElementById('energy-cancel').addEventListener('click',   () => submitInput(cancelValue(lastPrompt)));
document.getElementById('computer-cancel').addEventListener('click', () => submitInput(cancelValue(lastPrompt)));
document.getElementById('coords-cancel').addEventListener('click',   () => submitInput(cancelValue(lastPrompt)));

// Exit handler
async function handleExit() {
  addToLog('');
  addToLog((LANG_UI[currentLang] || LANG_UI.ja).gameOver);
  updateDisplay();
  await promptUser('PRESS ENTER TO RESTART');
  window.location.reload();
}

// Patch systems table to show translated names
(function patchSystemsTable() {
  const observer = new MutationObserver(() => {
    document.querySelectorAll('#systems-table .sys-name').forEach(td => {
      if (!td.getAttribute('data-en')) {
        td.setAttribute('data-en', td.textContent);
        td.textContent = translateSysName(td.textContent);
      }
    });
  });
  const table = document.getElementById('systems-table');
  if (table) observer.observe(table, { childList: true, subtree: true });
})();

// ---- Start game ----
onPrint(addToLog);
onInput(promptUser);
onExit(handleExit);

updateSrsButton();
updateLrsButton();
applyLang();
// Error recovery: show command buttons so user can attempt to resume
function showErrorRecovery(err) {
  const msg = String(err && err.message ? err.message : err);
  addToLog('');
  addToLog('⚠ ' + msg);
  addToLog('コマンドボタンから操作を再開してください');
  // Reset input state
  isWaitingForInput = false;
  inputResolve = null;
  navHide();
  // Show command buttons
  const cmdButtons = document.getElementById('command-buttons');
  const widgetArea = document.getElementById('widget-area');
  if (cmdButtons) cmdButtons.style.display = 'grid';
  if (widgetArea) widgetArea.style.display = 'none';
  document.querySelectorAll('.widget').forEach(w => { w.classList.remove('active'); w.style.display = 'none'; });
  document.querySelectorAll('.cmd-btn').forEach(btn => { btn.disabled = false; });
  console.error(err);
}

gameMain().catch(err => showErrorRecovery(err));

</script>
